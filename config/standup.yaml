# Configuration for daily stand-up notes generation.

queries:
  completed_yesterday:
    jql: 'assignee = {account_id} AND updated >= "{yesterday}" AND updated < "{today}" AND statusCategory = Done'
  in_progress:
    jql: 'assignee = {account_id} AND statusCategory = "In Progress"'
  blocked:
    jql: "assignee = {account_id} and filter = 15541 and sprint = {sprint_id} and statusCategory != done"
  injected:
    jql: "assignee = {account_id} and labels = added_to_sprint-id-{sprint_id} and {injected_date_filter}"
